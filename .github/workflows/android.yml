name: Android APK
on:
  push:
    branches: [android-native]
    paths: ['index.php', 'cabinet.php', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: php -l index.php && php -l cabinet.php
      - run: gradle -p android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pivland-Android
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Pivland-server
          path: |
            index.php
            cabinet.php
